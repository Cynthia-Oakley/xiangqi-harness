<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>观战 · Xiangqi Arena</title>
<style>
  :root {
    --paper: #f7f0dd;        /* 宣纸 */
    --board: #eecf9a;        /* 棋盘木色 */
    --line: #6b4f2a;         /* 棋盘线 */
    --red: #b03a2e;          /* 朱红 */
    --ink: #2c2c2c;          /* 墨黑 */
    --muted: #8a7a5c;
    --card: #fffdf6;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px 40px;
  }
  header { width: 100%; max-width: 1180px; text-align: center; margin-bottom: 14px; }
  header h1 { font-size: 22px; letter-spacing: 6px; font-weight: 600; }
  header .gid { color: var(--muted); font-size: 12px; font-family: monospace; margin-top: 4px; }
  #result-banner {
    display: none; margin: 10px auto 0; padding: 8px 28px;
    border: 2px solid var(--red); border-radius: 4px;
    color: var(--red); font-size: 20px; letter-spacing: 4px; width: fit-content;
    background: #fff8;
  }
  #wait-banner {
    display: none; margin: 10px auto 0; padding: 6px 22px;
    border: 1px dashed var(--muted); border-radius: 4px;
    color: var(--muted); font-size: 15px; letter-spacing: 3px; width: fit-content;
  }
  main { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; justify-content: center; }
  .card {
    background: var(--card); border: 1px solid #e0d3b0; border-radius: 6px;
    box-shadow: 0 1px 4px #0001;
  }
  /* ---- 棋盘 ---- */
  #board-card { padding: 14px; }
  svg text { user-select: none; }
  /* ---- 侧栏 ---- */
  .side { display: flex; flex-direction: column; gap: 14px; width: 240px; }
  .panel-title {
    padding: 8px 12px; border-bottom: 1px solid #e0d3b0;
    font-size: 14px; letter-spacing: 2px; display: flex; justify-content: space-between;
  }
  .panel-title .clock { font-family: monospace; letter-spacing: 0; font-size: 15px; }
  .panel-title .clock.low { color: var(--red); font-weight: 700; }
  #moves { height: 480px; overflow-y: auto; padding: 8px 12px; font-size: 14px; }
  #moves table { width: 100%; border-collapse: collapse; }
  #moves td { padding: 3px 4px; }
  #moves td.ply { color: var(--muted); width: 30px; text-align: right; }
  #moves tr.latest td { background: #f3e6c8; }
  .thoughts { height: 228px; overflow-y: auto; padding: 8px 12px; font-size: 13px; line-height: 1.6; }
  .thoughts .note { margin-bottom: 8px; padding: 6px 8px; background: #fbf6e7;
    border-left: 3px solid var(--line); border-radius: 0 4px 4px 0; }
  .thoughts .note .ply { color: var(--muted); font-size: 11px; font-family: monospace; }
  #panel-red .panel-title { color: var(--red); }
  #panel-red .note { border-left-color: var(--red); }
  .turn-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #ccc; margin-left: 6px; vertical-align: middle; }
  .turn-dot.on { background: #3a9b4f; }
  @media (max-width: 1100px) { .side { width: 100%; max-width: 560px; } }
</style>
</head>
<body>
<header>
  <h1>棋 局 观 战</h1>
  <div class="gid" id="gid"></div>
  <div id="result-banner"></div>
  <div id="wait-banner">等待双方入座，计时尚未开始</div>
</header>
<main>
  <div class="side card" style="padding:0">
    <div class="panel-title"><span>棋 谱</span></div>
    <div id="moves"><table><tbody id="moves-body"></tbody></table></div>
  </div>

  <div id="board-card" class="card"><svg id="board" width="506" height="558"></svg></div>

  <div class="side">
    <div class="card" id="panel-red" style="padding:0">
      <div class="panel-title">
        <span>红方 · <b id="name-r">红</b><span class="turn-dot" id="dot-r"></span></span>
        <span class="clock" id="clock-r">--:--</span>
      </div>
      <div class="thoughts" id="notes-r"></div>
    </div>
    <div class="card" id="panel-black" style="padding:0">
      <div class="panel-title">
        <span>黑方 · <b id="name-b">黑</b><span class="turn-dot" id="dot-b"></span></span>
        <span class="clock" id="clock-b">--:--</span>
      </div>
      <div class="thoughts" id="notes-b"></div>
    </div>
  </div>
</main>

<script>
"use strict";
const gid = location.pathname.split("/").filter(Boolean).pop();
document.getElementById("gid").textContent = gid;

/* ================= 棋盘 ================= */
const M = 45, S = 52, W = 8 * S, H = 9 * S;          // 边距 / 格距
const svg = document.getElementById("board");
const NS = "http://www.w3.org/2000/svg";
const GLYPH = { R:"车",N:"马",B:"相",A:"仕",K:"帅",C:"炮",P:"兵",
                r:"車",n:"馬",b:"象",a:"士",k:"將",c:"砲",p:"卒" };

function el(tag, attrs) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
}
const px = c => M + c * S;                 // 列 0..8 → x
const py = r => M + r * S;                 // FEN 行 0..9（黑方底线在顶）→ y

function line(x1, y1, x2, y2, w = 1.4) {
  svg.appendChild(el("line", { x1, y1, x2, y2, stroke: "var(--line)", "stroke-width": w }));
}

(function drawGrid() {
  svg.appendChild(el("rect", { x: 0, y: 0, width: "100%", height: "100%",
                               fill: "var(--board)", rx: 4 }));
  for (let r = 0; r <= 9; r++) line(M, py(r), M + W, py(r));
  line(px(0), M, px(0), M + H); line(px(8), M, px(8), M + H);          // 边线纵线
  for (let c = 1; c <= 7; c++) {                                        // 中间纵线断河
    line(px(c), M, px(c), py(4));
    line(px(c), py(5), px(c), M + H);
  }
  // 九宫斜线
  line(px(3), py(0), px(5), py(2)); line(px(5), py(0), px(3), py(2));
  line(px(3), py(7), px(5), py(9)); line(px(5), py(7), px(3), py(9));
  // 外框加粗
  svg.appendChild(el("rect", { x: M - 5, y: M - 5, width: W + 10, height: H + 10,
                               fill: "none", stroke: "var(--line)", "stroke-width": 2.4 }));
  // 楚河漢界
  for (const [txt, x] of [["楚 河", M + W * 0.22], ["漢 界", M + W * 0.78]]) {
    const t = el("text", { x, y: (py(4) + py(5)) / 2 + 10, "text-anchor": "middle",
                           "font-size": 26, fill: "var(--line)",
                           "font-family": "'Kaiti SC','STKaiti',serif", opacity: 0.8 });
    t.textContent = txt; svg.appendChild(t);
  }
  // 炮位/兵位角标
  const marks = [[1,2],[7,2],[1,7],[7,7],
                 [0,3],[2,3],[4,3],[6,3],[8,3],[0,6],[2,6],[4,6],[6,6],[8,6]];
  for (const [c, r] of marks) {
    const d = 5, L = 10;
    for (const [sx, sy] of [[-1,-1],[1,-1],[-1,1],[1,1]]) {
      if ((c === 0 && sx < 0) || (c === 8 && sx > 0)) continue;
      const x = px(c) + sx * d, y = py(r) + sy * d;
      line(x, y, x + sx * L, y, 1.2); line(x, y, x, y + sy * L, 1.2);
    }
  }
})();

let lastMove = null;
function renderBoard(fen) {
  svg.querySelectorAll(".piece,.hl").forEach(e => e.remove());
  if (lastMove) {
    const [fc, fr, tc, tr] = lastMove;
    svg.appendChild(el("circle", { class: "hl", cx: px(fc), cy: py(fr), r: 8,
                                   fill: "none", stroke: "#3a9b4f", "stroke-width": 2.5 }));
    svg.appendChild(el("circle", { class: "hl", cx: px(tc), cy: py(tr), r: 26,
                                   fill: "none", stroke: "#3a9b4f", "stroke-width": 2.5 }));
  }
  fen.split(" ")[0].split("/").forEach((row, r) => {
    let c = 0;
    for (const ch of row) {
      if (/\d/.test(ch)) { c += +ch; continue; }
      const red = ch === ch.toUpperCase();
      const x = px(c), y = py(r);
      const g = el("g", { class: "piece" });
      g.appendChild(el("circle", { cx: x, cy: y, r: 22, fill: "#fdf6e3",
                                   stroke: red ? "var(--red)" : "var(--ink)", "stroke-width": 2 }));
      g.appendChild(el("circle", { cx: x, cy: y, r: 18, fill: "none",
                                   stroke: red ? "var(--red)" : "var(--ink)",
                                   "stroke-width": 0.8, opacity: 0.5 }));
      const t = el("text", { x, y: y + 10, "text-anchor": "middle", "font-size": 28,
                             fill: red ? "var(--red)" : "var(--ink)",
                             "font-family": "'Kaiti SC','STKaiti','Noto Serif SC',serif" });
      t.textContent = GLYPH[ch];
      g.appendChild(t);
      svg.appendChild(g);
      c++;
    }
  });
}

/* ================= 数据区 ================= */
const state = { names: { r: "红", b: "黑" }, clocks: { r: 0, b: 0 }, turn: "r",
                result: null, started: false };
const $ = id => document.getElementById(id);
const REASON = { checkmate: "将死", timeout: "超时判负", resign: "认输",
                 draw_agreement: "协议和棋", halfmove_limit: "自然限着" };
function iccsToCells(iccs) {
  const col = ch => "abcdefghi".indexOf(ch);
  return [col(iccs[0]), 9 - +iccs[1], col(iccs[2]), 9 - +iccs[3]];
}

function fmtClock(sec) {
  sec = Math.max(0, sec);
  return `${String(Math.floor(sec / 60)).padStart(2, "0")}:${String(Math.floor(sec % 60)).padStart(2, "0")}`;
}
function paintClocks() {
  for (const s of ["r", "b"]) {
    const e = $("clock-" + s);
    e.textContent = fmtClock(state.clocks[s]);
    e.classList.toggle("low", state.started && state.clocks[s] < 60);
    $("dot-" + s).classList.toggle("on", state.started && state.turn === s && !state.result);
  }
  $("wait-banner").style.display = (state.started || state.result) ? "none" : "block";
}
setInterval(() => {           // 本地递减走棋方时钟，事件到达时再校准；开赛前后不动
  if (state.started && !state.result && state.turn) { state.clocks[state.turn] -= 0.25; paintClocks(); }
}, 250);

function addMove(entry) {
  const body = $("moves-body");
  if (entry.color === "r") {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td class="ply">${Math.ceil(entry.ply / 2)}.</td><td></td><td></td>`;
    body.appendChild(tr);
  }
  const tr = body.lastElementChild;
  tr.children[entry.color === "r" ? 1 : 2].textContent = entry.chinese;
  body.querySelectorAll("tr.latest").forEach(e => e.classList.remove("latest"));
  tr.classList.add("latest");
  $("moves").scrollTop = 1e9;
}

function addNote(n) {
  const box = $("notes-" + n.color);
  const div = document.createElement("div");
  div.className = "note";
  div.innerHTML = `<span class="ply">第${n.ply}手</span> `;
  div.appendChild(document.createTextNode(n.text));
  box.appendChild(div);
  box.scrollTop = 1e9;
}

function showResult(result, reason) {
  state.result = result;
  const b = $("result-banner");
  b.style.display = "block";
  b.textContent = result === "draw"
    ? `和棋 · ${REASON[reason] || reason}`
    : `${result === "red_win" ? state.names.r : state.names.b} 胜 · ${REASON[reason] || reason}`;
  paintClocks();
}

function applyBoardState(fen) {
  renderBoard(fen);
  state.turn = fen.split(" ")[1] === "w" ? "r" : "b";
  paintClocks();
}

/* ================= SSE ================= */
const es = new EventSource(`/api/games/${gid}/spectate`);

es.addEventListener("snapshot", e => {
  const d = JSON.parse(e.data);
  state.names = d.names; state.result = d.result; state.started = !!d.started;
  $("name-r").textContent = d.names.r; $("name-b").textContent = d.names.b;
  state.clocks = { r: d.clocks.remaining.r, b: d.clocks.remaining.b };
  $("moves-body").innerHTML = ""; $("notes-r").innerHTML = ""; $("notes-b").innerHTML = "";
  d.history.forEach(addMove);
  d.notes.forEach(addNote);
  lastMove = null;
  for (let i = d.history.length - 1; i >= 0; i--) {
    if (d.history[i].iccs !== "pass") { lastMove = iccsToCells(d.history[i].iccs); break; }
  }
  applyBoardState(d.fen);
  if (d.result) showResult(d.result, d.result_reason);
});

es.addEventListener("start", e => {      // 双方入座，开赛
  const d = JSON.parse(e.data);
  state.started = true;
  state.clocks = { r: d.clocks.remaining.r, b: d.clocks.remaining.b };
  applyBoardState(d.fen);
});

es.addEventListener("move", e => {
  const m = JSON.parse(e.data);
  if (m.iccs !== "pass") lastMove = iccsToCells(m.iccs);   // 停着不改高亮
  if (m.clocks) state.clocks = { r: m.clocks.remaining.r, b: m.clocks.remaining.b };
  applyBoardState(m.fen);
  addMove(m);
});

es.addEventListener("note", e => addNote(JSON.parse(e.data)));

es.addEventListener("result", e => {
  const d = JSON.parse(e.data);
  showResult(d.result, d.reason);
  es.close();
});

es.onerror = () => { /* EventSource 自动重连 */ };
</script>
</body>
</html>
