<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人机对弈 · Xiangqi Arena</title>
<style>
  :root {
    --paper: #f7f0dd;        /* 宣纸 */
    --board: #eecf9a;        /* 棋盘木色 */
    --line: #6b4f2a;         /* 棋盘线 */
    --red: #b03a2e;          /* 朱红 */
    --ink: #2c2c2c;          /* 墨黑 */
    --muted: #8a7a5c;
    --card: #fffdf6;
    --green: #3a9b4f;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px 40px;
  }
  header { width: 100%; max-width: 1180px; text-align: center; margin-bottom: 14px; }
  header h1 { font-size: 22px; letter-spacing: 6px; font-weight: 600; }
  header .gid { color: var(--muted); font-size: 12px; font-family: monospace; margin-top: 4px; }
  .banner {
    display: none; margin: 10px auto 0; padding: 8px 28px; border-radius: 4px;
    font-size: 17px; letter-spacing: 2px; width: fit-content; background: #fff8;
  }
  .banner.warn { border: 2px solid var(--red); color: var(--red); }
  .banner.info { border: 1px dashed var(--muted); color: var(--muted); font-size: 15px; }
  .banner.draw { border: 2px solid var(--green); color: var(--green); }
  .banner.draw button {
    margin-left: 12px; padding: 3px 14px; font-size: 14px; cursor: pointer;
    font-family: inherit; border-radius: 4px; border: 1px solid var(--green);
    background: #fff; color: var(--green);
  }
  .banner.draw button.solid { background: var(--green); color: #fff; }
  #err-toast {
    display: none; margin: 10px auto 0; padding: 6px 20px; border-radius: 4px;
    background: var(--red); color: #fff; font-size: 14px; width: fit-content;
  }
  main { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; justify-content: center; }
  .card {
    background: var(--card); border: 1px solid #e0d3b0; border-radius: 6px;
    box-shadow: 0 1px 4px #0001;
  }
  #board-card { padding: 14px; }
  svg text { user-select: none; }
  .side { display: flex; flex-direction: column; gap: 14px; width: 260px; }
  .panel-title {
    padding: 8px 12px; border-bottom: 1px solid #e0d3b0;
    font-size: 14px; letter-spacing: 2px; display: flex; justify-content: space-between;
  }
  .panel-title .clock { font-family: monospace; letter-spacing: 0; font-size: 15px; }
  .panel-title .clock.low { color: var(--red); font-weight: 700; }
  #moves { height: 400px; overflow-y: auto; padding: 8px 12px; font-size: 14px; }
  #moves table { width: 100%; border-collapse: collapse; }
  #moves td { padding: 3px 4px; }
  #moves td.ply { color: var(--muted); width: 30px; text-align: right; }
  #moves td .el { color: var(--muted); font-size: 11px; font-family: monospace; }
  #moves tr.latest td { background: #f3e6c8; }
  .turn-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #ccc; margin-left: 6px; vertical-align: middle; }
  .turn-dot.on { background: var(--green); }
  #time-status { padding: 6px 12px; font-size: 12px; color: var(--muted); line-height: 1.6; }
  #actions { display: flex; gap: 10px; padding: 12px; }
  #actions button {
    flex: 1; padding: 8px 0; font-size: 15px; letter-spacing: 2px; cursor: pointer;
    font-family: inherit; border-radius: 4px; border: 1px solid var(--line);
    background: #fffdf6; color: var(--ink);
  }
  #actions button:hover { background: #f3e6c8; }
  #actions button.danger { border-color: var(--red); color: var(--red); }
  #actions button:disabled { opacity: 0.4; cursor: not-allowed; }
  /* 预览确认对话框 */
  #dlg-mask {
    display: none; position: fixed; inset: 0; background: #0006; z-index: 10;
    align-items: center; justify-content: center;
  }
  #dlg {
    background: var(--card); border: 2px solid var(--line); border-radius: 8px;
    padding: 22px 30px; min-width: 320px; text-align: center;
    box-shadow: 0 6px 24px #0004;
  }
  #dlg h2 { font-size: 18px; letter-spacing: 3px; margin-bottom: 12px; }
  #dlg .mv { font-size: 26px; font-family: "Kaiti SC", "STKaiti", serif; margin-bottom: 8px; }
  #dlg .cap { color: var(--red); font-size: 15px; margin-bottom: 4px; }
  #dlg .chk { color: var(--red); font-size: 17px; font-weight: 700; margin-bottom: 4px; }
  #dlg .exp { color: var(--muted); font-size: 12px; margin-bottom: 16px; }
  #dlg .btns { display: flex; gap: 12px; justify-content: center; }
  #dlg button {
    padding: 8px 26px; font-size: 15px; letter-spacing: 2px; cursor: pointer;
    font-family: inherit; border-radius: 4px;
  }
  #dlg .ok { background: var(--red); border: 1px solid var(--red); color: #fff; }
  #dlg .no { background: #fff; border: 1px solid var(--line); color: var(--ink); }
  #fatal {
    display: none; margin: 60px auto; padding: 20px 40px; text-align: center;
    border: 2px solid var(--red); border-radius: 6px; color: var(--red);
    font-size: 20px; letter-spacing: 4px; background: var(--card);
  }
  @media (max-width: 1100px) { .side { width: 100%; max-width: 560px; } }
</style>
</head>
<body>
<header>
  <h1>人 机 对 弈</h1>
  <div class="gid" id="gid"></div>
  <div id="banner-wait" class="banner info">等待对方入座，计时尚未开始</div>
  <div id="banner-check" class="banner warn">将军！你必须应将</div>
  <div id="banner-draw" class="banner draw">
    对方提和
    <button class="solid" id="btn-accept-draw">接受</button>
    <button id="btn-decline-draw">拒绝</button>
  </div>
  <div id="banner-result" class="banner warn"></div>
  <div id="err-toast"></div>
</header>
<main id="main" style="display:none">
  <div id="board-card" class="card"><svg id="board" width="506" height="558"
       viewBox="0 0 506 558"></svg></div>
  <div class="side">
    <div class="card" style="padding:0">
      <div class="panel-title" id="panel-you">
        <span>你执<b id="you-color"></b> · <b id="you-name"></b><span class="turn-dot" id="dot-you"></span></span>
        <span class="clock" id="clock-you">--:--</span>
      </div>
      <div class="panel-title" id="panel-opp">
        <span>对手 · <b id="opp-name"></b><span class="turn-dot" id="dot-opp"></span></span>
        <span class="clock" id="clock-opp">--:--</span>
      </div>
      <div id="time-status"></div>
    </div>
    <div class="card" style="padding:0">
      <div class="panel-title"><span>棋 谱</span></div>
      <div id="moves"><table><tbody id="moves-body"></tbody></table></div>
    </div>
    <div class="card" id="assist-card" style="padding:0;display:none">
      <div class="panel-title">
        <span>辅助模式</span>
        <button id="btn-inspect" style="font-family:inherit;font-size:12px;cursor:pointer;
          border:1px solid var(--line);border-radius:4px;background:#fffdf6;
          color:var(--ink);padding:2px 10px">清点模式：关</button>
      </div>
      <div id="assist-out" style="padding:8px 12px;font-size:13px;line-height:1.7;
        white-space:pre-wrap;max-height:260px;overflow-y:auto;color:var(--ink)">开启清点模式后，点击棋盘任意格查看该格的攻防清点；每次落子后这里会显示走后自检。</div>
    </div>
    <div class="card" id="actions">
      <button id="btn-resign" class="danger">认输</button>
      <button id="btn-draw">提和</button>
    </div>
  </div>
</main>
<div id="fatal">令牌无效或对局不存在</div>
<div id="dlg-mask">
  <div id="dlg">
    <h2>确认落子</h2>
    <div class="mv" id="dlg-mv"></div>
    <div class="cap" id="dlg-cap"></div>
    <div class="chk" id="dlg-chk"></div>
    <div class="exp" id="dlg-exp"></div>
    <div class="btns">
      <button class="ok" id="dlg-ok">确认落子</button>
      <button class="no" id="dlg-no">再想想</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* 人机对弈页：绝不订阅 /spectate（防偷看对手思考笔记）。
   局面更新只走 GET /wait 长轮询（座位鉴权）。 */
const gid = location.pathname.split("/").filter(Boolean).pop();
const token = new URLSearchParams(location.search).get("token");
document.getElementById("gid").textContent = gid;

const $ = id => document.getElementById(id);
const REASON = { checkmate: "将死", timeout: "超时判负", resign: "认输",
                 draw_agreement: "协议和棋", halfmove_limit: "自然限着",
                 aborted: "裁判终止" };
const GLYPH = { R:"车",N:"马",B:"相",A:"仕",K:"帅",C:"炮",P:"兵",
                r:"車",n:"馬",b:"象",a:"士",k:"將",c:"砲",p:"卒" };
const CN_COLOR = p => p === p.toUpperCase() ? "红方" : "黑方";
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function api(method, path, body) {
  const opt = { method, headers: { "X-Seat-Token": token } };
  if (body !== undefined) {
    opt.headers["Content-Type"] = "application/json";
    opt.body = JSON.stringify(body);
  }
  const r = await fetch(path, opt);
  if (r.status === 401 || r.status === 403 || r.status === 404) {
    const e = new Error("令牌无效或对局不存在"); e.fatal = true; throw e;
  }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(d.error || `请求失败(${r.status})`); throw e; }
  return d;
}

function fatal() {
  $("fatal").style.display = "block";
  $("main").style.display = "none";
}
let toastTimer = null;
function toast(msg) {
  const t = $("err-toast");
  t.textContent = msg; t.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.style.display = "none", 4000);
}

/* ================= 棋盘（含黑方 180° 朝向翻转） ================= */
const M = 45, S = 52, W = 8 * S, H = 9 * S;
const svg = $("board");
const NS = "http://www.w3.org/2000/svg";
let flip = false;                 // 执黑时行列双反转，己方在下方
const px = c => M + (flip ? 8 - c : c) * S;
const py = r => M + (flip ? 9 - r : r) * S;

function el(tag, attrs) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
}
function line(x1, y1, x2, y2, w = 1.4) {
  svg.appendChild(el("line", { x1, y1, x2, y2, stroke: "var(--line)", "stroke-width": w }));
}
let gridDrawn = false;
function drawGrid() {
  if (gridDrawn) return;
  gridDrawn = true;
  svg.appendChild(el("rect", { x: 0, y: 0, width: "100%", height: "100%",
                               fill: "var(--board)", rx: 4 }));
  for (let r = 0; r <= 9; r++) line(M, py(r), M + W, py(r));
  line(px(0), M, px(0), M + H); line(px(8), M, px(8), M + H);
  for (let c = 1; c <= 7; c++) {
    line(px(c), M, px(c), py(4));
    line(px(c), py(5), px(c), M + H);
  }
  line(px(3), py(0), px(5), py(2)); line(px(5), py(0), px(3), py(2));
  line(px(3), py(7), px(5), py(9)); line(px(5), py(7), px(3), py(9));
  svg.appendChild(el("rect", { x: M - 5, y: M - 5, width: W + 10, height: H + 10,
                               fill: "none", stroke: "var(--line)", "stroke-width": 2.4 }));
  for (const [txt, x] of [["楚 河", M + W * 0.22], ["漢 界", M + W * 0.78]]) {
    const t = el("text", { x, y: (py(4) + py(5)) / 2 + 10, "text-anchor": "middle",
                           "font-size": 26, fill: "var(--line)",
                           "font-family": "'Kaiti SC','STKaiti',serif", opacity: 0.8 });
    t.textContent = txt; svg.appendChild(t);
  }
  const marks = [[1,2],[7,2],[1,7],[7,7],
                 [0,3],[2,3],[4,3],[6,3],[8,3],[0,6],[2,6],[4,6],[6,6],[8,6]];
  for (const [c, r] of marks) {
    const d = 5, L = 10;
    for (const [sx, sy] of [[-1,-1],[1,-1],[-1,1],[1,1]]) {
      if ((c === 0 && sx < 0) || (c === 8 && sx > 0)) continue;
      const x = px(c) + sx * d, y = py(r) + sy * d;
      line(x, y, x + sx * L, y, 1.2); line(x, y, x, y + sy * L, 1.2);
    }
  }
}

let lastMove = null;              // [fc, fr, tc, tr] 逻辑坐标
let selection = null;             // {c, r}
let targets = new Map();          // "c,r" → {capture, chinese}
let pending = null;               // 预览 {pending_id, ...}

function parseFenBoard(fen) {
  const grid = [];
  fen.split(" ")[0].split("/").forEach((row, r) => {
    grid[r] = [];
    for (const ch of row) {
      if (/\d/.test(ch)) { for (let i = 0; i < +ch; i++) grid[r].push(null); }
      else grid[r].push(ch);
    }
  });
  return grid;
}

function renderBoard(fen) {
  drawGrid();
  svg.querySelectorAll(".piece,.hl,.dot,.selring").forEach(e => e.remove());
  const grid = parseFenBoard(fen);
  if (lastMove) {
    const [fc, fr, tc, tr] = lastMove;
    svg.appendChild(el("circle", { class: "hl", cx: px(fc), cy: py(fr), r: 8,
                                   fill: "none", stroke: "#3a9b4f", "stroke-width": 2.5 }));
    svg.appendChild(el("circle", { class: "hl", cx: px(tc), cy: py(tr), r: 26,
                                   fill: "none", stroke: "#3a9b4f", "stroke-width": 2.5 }));
  }
  if (selection) {
    svg.appendChild(el("circle", { class: "selring", cx: px(selection.c), cy: py(selection.r),
                                   r: 25, fill: "none", stroke: "#d4a017",
                                   "stroke-width": 2.5, "stroke-dasharray": "5 4" }));
  }
  for (const [key, t] of targets) {
    const [c, r] = key.split(",").map(Number);
    const attrs = t.capture
      ? { class: "dot", cx: px(c), cy: py(r), r: 15, fill: "none",
          stroke: "var(--red)", "stroke-width": 3 }
      : { class: "dot", cx: px(c), cy: py(r), r: 7, fill: "var(--green)", opacity: 0.85 };
    svg.appendChild(el("circle", attrs));
  }
  grid.forEach((row, r) => row.forEach((ch, c) => {
    if (!ch) return;
    const red = ch === ch.toUpperCase();
    const x = px(c), y = py(r);
    const g = el("g", { class: "piece" });
    g.appendChild(el("circle", { cx: x, cy: y, r: 22, fill: "#fdf6e3",
                                 stroke: red ? "var(--red)" : "var(--ink)", "stroke-width": 2 }));
    g.appendChild(el("circle", { cx: x, cy: y, r: 18, fill: "none",
                                 stroke: red ? "var(--red)" : "var(--ink)",
                                 "stroke-width": 0.8, opacity: 0.5 }));
    const t = el("text", { x, y: y + 10, "text-anchor": "middle", "font-size": 28,
                           fill: red ? "var(--red)" : "var(--ink)",
                           "font-family": "'Kaiti SC','STKaiti','Noto Serif SC',serif" });
    t.textContent = GLYPH[ch];
    g.appendChild(t);
    svg.appendChild(g);
  }));
}

/* ================= 状态与显示 ================= */
const me = { color: null, names: { r: "红", b: "黑" } };
const st = { started: false, result: null, turn: null, ply: -1,
             clocks: { r: 0, b: 0 } };
let movesCache = null;            // /moves 缓存（轮到己方时拉取）
let drawDismissed = false;

function oppColor() { return me.color === "r" ? "b" : "r"; }
function fmtClock(sec) {
  sec = Math.max(0, sec);
  return `${String(Math.floor(sec / 60)).padStart(2, "0")}:${String(Math.floor(sec % 60)).padStart(2, "0")}`;
}
function paintClocks() {
  const you = me.color, opp = oppColor();
  for (const [c, pre] of [[you, "you"], [opp, "opp"]]) {
    const e = $("clock-" + pre);
    e.textContent = fmtClock(st.clocks[c]);
    e.classList.toggle("low", st.started && st.clocks[c] < 60);
    $("dot-" + pre).classList.toggle("on",
      st.started && st.turn === c && !st.result);
  }
}
setInterval(() => {
  if (st.started && !st.result && st.turn) { st.clocks[st.turn] -= 0.25; paintClocks(); }
}, 250);

function iccsToCells(iccs) {
  const col = ch => "abcdefghi".indexOf(ch);
  return [col(iccs[0]), 9 - +iccs[1], col(iccs[2]), 9 - +iccs[3]];
}
const sqName = (c, r) => "abcdefghi"[c] + (9 - r);

async function refreshMoves() {
  movesCache = null;
  const d = await api("GET", `/api/games/${gid}/moves`);
  movesCache = d.moves;
  applySelection();
}

function applySelection() {
  targets = new Map();
  if (selection && movesCache) {
    const from = sqName(selection.c, selection.r);
    for (const m of movesCache) {
      if (m.iccs.slice(0, 2) === from) {
        const tc = "abcdefghi".indexOf(m.iccs[2]), tr = 9 - +m.iccs[3];
        targets.set(tc + "," + tr, { capture: m.capture, chinese: m.chinese });
      }
    }
  }
  renderBoard(currentFen);
}

function renderMoves(entries) {
  const body = $("moves-body");
  body.innerHTML = "";
  for (const m of entries) {
    if (m.color === "r") {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td class="ply">${Math.ceil(m.ply / 2)}.</td><td></td><td></td>`;
      body.appendChild(tr);
    }
    const tr = body.lastElementChild;
    if (!tr) continue;
    const td = tr.children[m.color === "r" ? 1 : 2];
    td.textContent = m.chinese + " ";
    const el2 = document.createElement("span");
    el2.className = "el"; el2.textContent = Math.round(m.elapsed) + "s";
    td.appendChild(el2);
    body.querySelectorAll("tr.latest").forEach(e => e.classList.remove("latest"));
    tr.classList.add("latest");
  }
  $("moves").scrollTop = 1e9;
}

async function refreshLog() {
  const d = await api("GET", `/api/games/${gid}/log`);
  renderMoves(d.moves);
}

function showResult(result, reason, names) {
  const b = $("banner-result");
  b.style.display = "block";
  b.textContent = result === "draw"
    ? `和棋 · ${REASON[reason] || reason}`
    : `${result === "red_win" ? names.r : names.b} 胜 · ${REASON[reason] || reason}`;
}

let currentFen = null;
function applyState(s) {
  st.started = s.started; st.result = s.result; st.turn = s.turn;
  st.ply = s.ply;
  st.clocks = { r: s.clocks.remaining.r, b: s.clocks.remaining.b };
  me.names = s.names;
  currentFen = s.fen;
  if (s.assist) $("assist-card").style.display = "block";
  lastMove = s.last_move && s.last_move.iccs !== "pass"
    ? iccsToCells(s.last_move.iccs) : lastMove;
  renderBoard(s.fen);
  $("time-status").textContent = s.time_status || "";
  $("banner-wait").style.display = (s.started || s.result) ? "none" : "block";
  $("banner-check").style.display =
    (s.started && !s.result && s.in_check) ? "block" : "none";
  if (!s.draw_offered) drawDismissed = false;
  $("banner-draw").style.display =
    (s.draw_offered && !drawDismissed && !s.result) ? "block" : "none";
  if (s.result) {
    $("banner-result").style.display = "block";
    showResult(s.result, s.result_reason, s.names);
    $("banner-draw").style.display = "none";
  }
  paintClocks();
  if (s.your_turn && !pending) {
    if (!movesCache) refreshMoves().catch(e => { if (!e.fatal) toast(e.message); });
    else applySelection();      // 局面刷新后重画选中提示（/wait 每 ≤30s 返回一次）
  } else if (!s.your_turn) {
    movesCache = null;
    selection = null;
    targets = new Map();
    renderBoard(s.fen);
  }
  if (s.ply !== lastLogPly) { lastLogPly = s.ply; refreshLog().catch(() => {}); }
}
let lastLogPly = -1;

/* ================= 辅助模式：落点清点 + 走后自检 ================= */
let inspectMode = false;
function showAssist(text) { $("assist-out").textContent = text; }

async function doInspect(sq) {
  try {
    const d = await api("GET", `/api/games/${gid}/inspect/${sq}`);
    showAssist(d.report);
  } catch (e) { if (e.fatal) return fatal(); toast(e.message); }
}

$("btn-inspect").addEventListener("click", () => {
  inspectMode = !inspectMode;
  $("btn-inspect").textContent = inspectMode ? "清点模式：开（点格子查看）" : "清点模式：关";
  $("btn-inspect").style.borderColor = inspectMode ? "var(--red)" : "var(--line)";
  $("btn-inspect").style.color = inspectMode ? "var(--red)" : "var(--ink)";
  selection = null; targets = new Map(); renderBoard(currentFen);
});

/* ================= 走棋交互（两阶段：选子 → 预览确认） ================= */
function boardPoint(evt) {
  const rect = svg.getBoundingClientRect();
  const x = (evt.clientX - rect.left) * (506 / rect.width);
  const y = (evt.clientY - rect.top) * (558 / rect.height);
  let c = Math.round((x - M) / S), r = Math.round((y - M) / S);
  if (c < 0 || c > 8 || r < 0 || r > 9) return null;
  // 点击位置离交叉点太远视为无效（屏幕坐标，勿用翻转后的 px/py）
  if (Math.hypot(x - (M + c * S), y - (M + r * S)) > S * 0.45) return null;
  return { c: flip ? 8 - c : c, r: flip ? 9 - r : r };   // 反变换回逻辑坐标
}

svg.addEventListener("click", evt => {
  if (st.result || pending) return;
  const p = boardPoint(evt);
  if (inspectMode) {                                // 清点模式：点格子只查攻防，不走子
    if (p) {
      selection = { c: p.c, r: p.r };
      renderBoard(currentFen);
      doInspect(sqName(p.c, p.r));
    }
    return;
  }
  if (!st.started || !st.turn) {                        // 对局未开始（对方未入座）
    toast("对方尚未入座，对局未开始，暂不能走子"); return;
  }
  if (me.color !== st.turn) { toast("还没轮到你走棋"); return; }
  if (!p) { selection = null; applySelection(); return; }
  const grid = parseFenBoard(currentFen);
  const piece = grid[p.r] && grid[p.r][p.c];
  const key = p.c + "," + p.r;
  if (selection && targets.has(key)) {                  // 点落点 → 预览
    proposeMove(targets.get(key).chinese);
    return;
  }
  if (piece && (piece === piece.toUpperCase()) === (me.color === "r")) {
    selection = { c: p.c, r: p.r };
    applySelection();
  } else {
    selection = null;
    applySelection();
  }
});

async function proposeMove(chinese) {
  const from = sqName(selection.c, selection.r);
  const m = (movesCache || []).find(m => m.chinese === chinese && m.iccs.slice(0, 2) === from);
  if (!m) return;
  try {
    const pv = await api("POST", `/api/games/${gid}/move`, { move: m.iccs, note: null });
    pending = pv;
    showDialog(pv);
  } catch (e) {
    if (e.fatal) return fatal();
    toast(e.message);
    selection = null; applySelection();
    if (st.your_turn) refreshMoves().catch(() => {});
  }
}

function showDialog(pv) {
  $("dlg-mv").textContent = pv.chinese;
  $("dlg-cap").textContent = pv.captured
    ? `吃 ${CN_COLOR(pv.captured)}${GLYPH[pv.captured]}` : "";
  $("dlg-chk").textContent = pv.gives_check ? "将军！" : "";
  $("dlg-exp").textContent = `预览有效期 ${Math.round(pv.expires_in)} 秒，逾期需重新走子`;
  $("dlg-mask").style.display = "flex";
}
function hideDialog() { $("dlg-mask").style.display = "none"; }

async function settle(ok) {
  const pv = pending;
  pending = null;
  hideDialog();
  selection = null; targets = new Map();
  try {
    if (ok) {
      const d = await api("POST", `/api/games/${gid}/commit`, { pending_id: pv.pending_id });
      movesCache = null;
      if (d.self_check) showAssist("走后自检\n" + d.self_check);   // 辅助模式
    } else {
      await api("POST", `/api/games/${gid}/cancel`, { pending_id: pv.pending_id });
    }
  } catch (e) {
    if (e.fatal) return fatal();
    toast(e.message);
  }
  applySelection();
}
$("dlg-ok").addEventListener("click", () => settle(true));
$("dlg-no").addEventListener("click", () => settle(false));
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && pending) settle(false);
});

/* ================= 底部操作 ================= */
let resignArmed = false, resignTimer = null;
$("btn-resign").addEventListener("click", async () => {
  if (!resignArmed) {
    resignArmed = true;
    $("btn-resign").textContent = "确认认输？";
    clearTimeout(resignTimer);
    resignTimer = setTimeout(() => { resignArmed = false; $("btn-resign").textContent = "认输"; }, 3000);
    return;
  }
  try {
    await api("POST", `/api/games/${gid}/resign`);
  } catch (e) { if (e.fatal) return fatal(); toast(e.message); }
});
$("btn-draw").addEventListener("click", async () => {
  try {
    await api("POST", `/api/games/${gid}/offer-draw`);
    toast("已提出和棋，等待对方回应");
  } catch (e) { if (e.fatal) return fatal(); toast(e.message); }
});
$("btn-accept-draw").addEventListener("click", async () => {
  try {
    await api("POST", `/api/games/${gid}/accept-draw`);
  } catch (e) { if (e.fatal) return fatal(); toast(e.message); }
});
$("btn-decline-draw").addEventListener("click", () => {
  drawDismissed = true;
  $("banner-draw").style.display = "none";
});

/* ================= 主循环：join → 初始 state → /wait 长轮询 ================= */
async function main() {
  if (!token) return fatal();
  try {
    await api("POST", `/api/games/${gid}/join`);        // 幂等
    const s0 = await api("GET", `/api/games/${gid}/state`);
    me.color = s0.your_color;
    flip = me.color === "b";
    const opp = oppColor();
    $("you-color").textContent = me.color === "r" ? "红" : "黑";
    $("you-name").textContent = s0.names[me.color];
    $("opp-name").textContent = s0.names[opp];
    $("panel-you").style.color = me.color === "r" ? "var(--red)" : "var(--ink)";
    $("panel-opp").style.color = opp === "r" ? "var(--red)" : "var(--ink)";
    $("main").style.display = "flex";
    applyState(s0);
    let ply = s0.ply;
    while (!st.result) {
      let s;
      try {
        s = await api("GET", `/api/games/${gid}/wait?ply=${ply}`);
      } catch (e) {
        if (e.fatal) return fatal();
        await sleep(2000);                              // 失败 2s 重试
        continue;
      }
      ply = s.ply;
      applyState(s);
    }
  } catch (e) {
    return fatal();
  }
}
main();
</script>
